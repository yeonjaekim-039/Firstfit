services:
  postgres:
    image: postgres:16-alpine
    container_name: github-issue-matcher-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-github_issue_matcher}
    ports:
      # Host 5433 -> container 5432 (5432 is used by another local project)
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-github_issue_matcher}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
